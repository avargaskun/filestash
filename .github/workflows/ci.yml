name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (transcoder)
        run: go test -race -v ./server/plugin/plg_video_transcoder/mediaref/...

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: filestash:ci
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name filestash-ci -p 8334:8334 filestash:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8334/healthz; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null -w 'healthz=%{http_code}\n' http://localhost:8334/healthz
          curl -sf -o /dev/null -w 'about=%{http_code}\n' http://localhost:8334/about
          echo "--- VAAPI runtime ---"
          docker exec filestash-ci sh -c 'ls -l /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so && command -v vainfo'
          docker logs filestash-ci
          docker rm -f filestash-ci
